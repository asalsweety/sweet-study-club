name: Validate

on:
  pull_request:
  push:
    branches:
      - main
      - hesam-dev
  workflow_dispatch:
    inputs:
      deploy_to_vps:
        type: boolean
        description: Deploy the verified main revision
        default: false

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Apply migrations to isolated local D1
        run: npm run db:migrate:local

      - name: Validate application
        run: npm run validate

      - name: Validate Cloudflare deployment bundle
        run: npm run cf:dry-run

      - name: Reject high-severity dependency advisories
        run: |
          npm audit --audit-level=high
          npm --prefix deployment/vps-backup audit --omit=dev --audit-level=high

  production:
    if: >-
      github.ref == 'refs/heads/main' &&
      vars.SWEETSTUDY_VPS_DEPLOY_ENABLED == 'true' &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy_to_vps))
    needs: application
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Build the VPS release
        run: |
          npm ci --ignore-scripts
          npm run cf:build:production
          bash deployment/vps-production/build-release.sh "$GITHUB_SHA" "$RUNNER_TEMP/sweetstudy-release.tar.gz"

      - name: Deploy the verified main revision
        env:
          VPS_RELEASE_KEY: ${{ secrets.SWEETSTUDY_VPS_RELEASE_KEY }}
          VPS_HOST: ${{ vars.SWEETSTUDY_VPS_HOST }}
          VPS_KNOWN_HOSTS: ${{ vars.SWEETSTUDY_VPS_KNOWN_HOSTS }}
          VPS_SSH_PORT: ${{ vars.SWEETSTUDY_VPS_SSH_PORT || '49222' }}
          HEALTH_ORIGIN: ${{ vars.SWEETSTUDY_VPS_HEALTH_ORIGIN || 'https://sweetstudy.site' }}
        run: |
          test -n "$VPS_RELEASE_KEY" && test -n "$VPS_HOST" && test -n "$VPS_KNOWN_HOSTS"
          health_host=${HEALTH_ORIGIN#https://}
          health_host=${health_host%/}
          [[ "$HEALTH_ORIGIN" == https://* && "$health_host" =~ ^[A-Za-z0-9.-]+$ ]]
          target="$health_host:443:$VPS_HOST:443"
          umask 077
          key=$(mktemp)
          hosts=$(mktemp)
          trap 'rm -f -- "$key" "$hosts"' EXIT
          printf '%s\n' "$VPS_RELEASE_KEY" > "$key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$hosts"
          # SSH listens on 49222. HostKeyAlias keeps the saved known_hosts entry for the host valid on that port.
          ssh -T -p "$VPS_SSH_PORT" -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$hosts" \
            -o HostKeyAlias="$VPS_HOST" "root@$VPS_HOST" "$GITHUB_SHA" < "$RUNNER_TEMP/sweetstudy-release.tar.gz"
          published=$(curl --fail --silent --show-error --max-time 15 --connect-to "$target" "${HEALTH_ORIGIN%/}/revision.txt")
          test "$published" = "$GITHUB_SHA"
          curl --fail --silent --show-error --max-time 15 --connect-to "$target" "${HEALTH_ORIGIN%/}/api/ready"
