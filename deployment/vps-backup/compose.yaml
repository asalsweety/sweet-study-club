name: sweet-study-club-backup
services:
  api:
    image: sweet-study-club-backup:${RELEASE_TAG:?Set the committed release revision}
    build: .
    restart: unless-stopped
    init: true
    env_file: /opt/sweet-study-club-backup/backup.env
    ports:
      - '127.0.0.1:18787:8787'
    volumes:
      - /opt/sweet-study-club-backup/data:/data
    read_only: true
    tmpfs:
      - /tmp:size=128m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: '3'
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8787/api/ready').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 3
