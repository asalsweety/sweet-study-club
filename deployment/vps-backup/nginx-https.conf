map $uri $sweetstudy_backup_cache_control {
    ~^/api/ "";
    ~^/assets/ "public, max-age=31536000, immutable";
    default "public, max-age=0, must-revalidate";
}

server {
    listen 8443 ssl;
    server_name backup.sweetstudy.site;
    ssl_certificate /etc/letsencrypt/live/backup.sweetstudy.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/backup.sweetstudy.site/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /opt/sweet-study-club-backup/current/client;

    add_header Cache-Control $sweetstudy_backup_cache_control always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self' data:; form-action 'self'; frame-ancestors 'none'; frame-src https://www.youtube-nocookie.com https://www.youtube.com https://w.soundcloud.com https://open.spotify.com; img-src 'self' data: blob:; manifest-src 'self'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security max-age=31536000 always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:18787;
        proxy_http_version 1.1;
        proxy_pass_request_headers off;
        proxy_set_header Host backup.sweetstudy.site:8443;
        proxy_set_header Connection "";
        proxy_set_header Content-Type $http_content_type;
        proxy_set_header Accept $http_accept;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Origin $http_origin;
        proxy_set_header Referer $http_referer;
        proxy_set_header User-Agent $http_user_agent;
        proxy_set_header Sec-Fetch-Site $http_sec_fetch_site;
        proxy_set_header Sec-Fetch-Mode $http_sec_fetch_mode;
        proxy_set_header Sec-Fetch-Dest $http_sec_fetch_dest;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location ~ /\. {
        return 404;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
